[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stream_processor"
version = "0.1.0"
description = "Лабораторна робота №3: Потокова обробка системи оцінювання студентів (Варіант 7)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
run-stream = "stream_processor.main:main"

[tool.setuptools.packages.find]
where = ["src"]
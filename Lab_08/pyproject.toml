[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "grade-manager"
version = "0.8.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "httpx",
    "pydantic"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio"
]
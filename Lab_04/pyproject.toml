[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oop_project"
version = "1.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
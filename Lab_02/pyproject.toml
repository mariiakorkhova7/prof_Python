[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-processor"
version = "0.1.0"
description = "Лабораторна робота 2: Структури даних та функціональна декомпозиція (Варіант 7)"
authors = [
    {name = "Марія Корхова"}
]
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]